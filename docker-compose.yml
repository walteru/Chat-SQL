version: '3.8'

services:
  sql-chat-mysql:
    container_name: sql-chat-mysql
    image: mysql:8.0
    ports:
      - '3307:3306'
    environment:
      MYSQL_DATABASE: sqlchat
      MYSQL_ROOT_PASSWORD: sqlchat123
      MYSQL_USER: sqlchat
      MYSQL_PASSWORD: sqlchat123
    volumes:
      - sql-chat-mysql-data:/var/lib/mysql
      - ./uploads:/var/uploads
    networks:
      - sql-chat-network
    command: ['mysqld', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci', '--sql_mode=', '--max_allowed_packet=1073741824']

  sql-chat-backend:
    container_name: sql-chat-backend
    build:
      context: ./backend
    ports:
      - '3001:3000'
    volumes:
      - ./uploads:/app/uploads
    networks:
      - sql-chat-network
    depends_on:
      - sql-chat-mysql
    environment:
      DB_HOST: sql-chat-mysql
      DB_PORT: 3306
      DB_NAME: sqlchat
      DB_USER: sqlchat
      DB_PASSWORD: sqlchat123

  sql-chat-frontend:
    container_name: sql-chat-frontend
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sql-chat-network
    depends_on:
      - sql-chat-backend

networks:
  sql-chat-network:
    driver: bridge

volumes:
  sql-chat-mysql-data: